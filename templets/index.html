<!DOCTYPE html>
<html>
<head>
    <title>Stock Trend Analyzer</title>
</head>
<body>
    <h1>Upload Stock CSV File</h1>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required />
        <input type="submit" value="Analyze" />
    </form>

    {% if prediction %}
        <h2>Prediction: Stock might go <strong>{{ prediction }}</strong></h2>
        <h3>Model Accuracy: {{ accuracy * 100 | round(2) }}%</h3>
        <img src="/static/plot.png" alt="Stock Trend Plot" width="600">
    {% endif %}
</body>
</html>
